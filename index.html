<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>CBO Events</title>
    <meta name="description" content="Charlotte Business Owners — events, networking, and check-in" />

    <!-- PWA / theme -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="light" />

    <!-- iOS standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CBO Events" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <style>
      .cbo-boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        color: #fff;
        text-align: center;
        background: linear-gradient(135deg, #020617, #0f172a 55%, #1e293b);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .cbo-boot-card {
        width: min(100%, 320px);
        padding: 32px;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 24px;
        background: rgba(255,255,255,.08);
        box-shadow: 0 24px 60px rgba(0,0,0,.28);
      }
      .cbo-boot-logo { width: 88px; height: 88px; object-fit: contain; padding: 8px; border-radius: 18px; background: #fff; }
      .cbo-boot h1 { margin: 20px 0 8px; font-size: 20px; }
      .cbo-boot p { margin: 0; color: #cbd5e1; font-size: 14px; line-height: 1.5; }
      .cbo-boot button { margin-top: 20px; padding: 11px 18px; border: 0; border-radius: 12px; color: #0f172a; background: #fff; font-weight: 700; cursor: pointer; }
    </style>
    <script>
      (() => {
        const showLoadError = () => {
          const root = document.getElementById('root');
          if (!root) return;
          root.innerHTML = '<main class="cbo-boot"><section class="cbo-boot-card" role="alert"><img class="cbo-boot-logo" src="/cbo-logo.png" alt="Charlotte Business Owners"><h1>CBO needs a quick reload</h1><p>A saved app version could not finish loading. Reload to open the latest version.</p><button type="button" onclick="window.location.reload()">Reload CBO</button></section></main>';
        };

        window.addEventListener('error', (event) => {
          const target = event.target;
          if (target instanceof HTMLScriptElement || (target instanceof HTMLLinkElement && target.rel === 'stylesheet')) {
            showLoadError();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <main class="cbo-boot">
        <section class="cbo-boot-card" role="status" aria-live="polite">
          <img class="cbo-boot-logo" src="/cbo-logo.png" alt="Charlotte Business Owners" />
          <h1>Opening CBO…</h1>
          <p>Loading your events and community</p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
